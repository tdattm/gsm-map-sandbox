<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSM Performance Lab</title>
<style>body{font:15px system-ui;background:#f1f2ed;color:#173d36;margin:16px}label{display:inline-block;margin:6px}button,input,select{font:inherit;padding:7px;margin:4px}#map{height:543px;width:min(764px,95vw);border:1px solid #c7cbc4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}video{width:240px}#result{max-height:500px;overflow:auto}</style></head>
<body><h1>GSM Performance Lab</h1><p>Đo chẩn đoán có kiểm soát; fixture chỉ kiểm render, không phải hành trình OSRM. Video tổng hợp không phải Google Meet thật.</p>
<label>Stage <select id="stage"><option value="plain">Plain RAF (không MapLibre)</option><option value="blank">MapLibre background trống</option><option value="basemap">Hanoi basemap, không xe</option><option value="100-static">Hanoi + 100 xe tĩnh</option><option value="100-play">Hanoi + 100 xe playback</option><option value="1000-play">Hanoi + 1000 xe playback</option><option value="5000-play">Hanoi + 5000 xe playback</option></select></label>
<label><input id="pan" type="checkbox">Pan trong phép đo</label><label><input id="video" type="checkbox">Video tổng hợp 640×360 / 30 Hz</label>
<label>Thời lượng <input id="seconds" type="number" min="3" max="60" value="5"></label><label><input id="profile" type="checkbox">JS sampling profiler (nếu browser hỗ trợ)</label><button id="prepare">Chuẩn bị stage</button><button id="measure">Đo</button><button id="matrix">Đo isolation matrix tuần tự</button><button id="download">Tải JSON + application trace</button>
<p id="state" role="status">Chưa có MapLibre, sẵn sàng plain RAF cold.</p><div id="map"></div><div id="media"></div><details><summary>Raw capture</summary><pre id="result" data-testid="performance-result"></pre></details>
<script id="all-results" type="application/json">[]</script><script type="module" src="/src/performance-lab.ts"></script></body></html>
