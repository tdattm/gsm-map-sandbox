name: Source checks
on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main, 'feature/**', 'codex/**']
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RUN_REAL_DATA: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pytest -q -rs
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --maxWorkers=2
      - run: npm run typecheck
      # Existing warnings remain visible; lint errors still fail the job.
      - run: npm run lint
      - run: npm run build
      - name: Verify Saved Replay package when shipped
        run: |
          if [ -f public/replay/demo-experiment.json ] || [ -f public/replay/manifest.json ]; then
            npm run verify:replay
          else
            echo 'SKIP package verification: sealed public/replay assets are not shipped in this checkout. Replay contract tests still run in Vitest.'
          fi
